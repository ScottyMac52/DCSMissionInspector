name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      app:
        description: 'App to release (leave empty to build all)'
        required: false
        type: choice
        options:
          - ''
          - DcsMissionReader
          - LuaParser
      create_release:
        description: 'Create GitHub Release?'
        required: false
        default: false
        type: boolean

jobs:
  build:
    name: Build All Apps
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Detect Projects
        id: detect
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $solutions = @(Get-ChildItem -Path . -Recurse -Filter *.sln -File |
              Where-Object { $_.FullName -notmatch '\\bin\\' -and $_.FullName -notmatch '\\obj\\' })
          if ($solutions.Count -eq 0) { throw "No .sln found" }
          if ($solutions.Count -gt 1) { throw "Multiple .sln files found" }

          $solutionFile = $solutions[0]
          $solutionRelative = (Resolve-Path $solutionFile.FullName -Relative).TrimStart('.\\')

          $projects = @(Get-ChildItem -Path . -Recurse -Filter *.csproj -File |
              Where-Object { $_.FullName -notmatch '\\bin\\' -and $_.FullName -notmatch '\\obj\\' })

          $projectInfo = foreach ($p in $projects) {
              $content = Get-Content $p.FullName -Raw
              $isTest = $content -match '<IsTestProject>\s*true\s*</IsTestProject>' -or
                        $content -match 'Microsoft\.NET\.Test\.Sdk' -or
                        $p.BaseName -match '(?i)(test|tests)$'
              $isExe = $content -match '<OutputType>\s*Exe\s*</OutputType>' -or
                       $content -match '<OutputType>\s*WinExe\s*</OutputType>'

              [PSCustomObject]@{
                  RelativePath = (Resolve-Path $p.FullName -Relative).TrimStart('.\\')
                  BaseName     = $p.BaseName
                  IsTest       = $isTest
                  IsExe        = $isExe
              }
          }

          $apps = @($projectInfo | Where-Object { -not $_.IsTest -and $_.IsExe })
          if ($apps.Count -eq 0) { throw "No executable projects found" }

          $appsJson = $apps | ConvertTo-Json -Compress
          "SOLUTION=$solutionRelative" >> $env:GITHUB_OUTPUT
          "APPS_JSON=$appsJson" >> $env:GITHUB_OUTPUT

      - name: Build & Package Apps
        shell: pwsh
        run: |
          $apps = $env:APPS_JSON | ConvertFrom-Json
          $solution = $env:SOLUTION

          foreach ($app in $apps) {
              Write-Host "=== Processing $($app.BaseName) ==="

              $publishDir = "publish/$($app.BaseName)"
              dotnet publish $app.RelativePath -c Release -r win-x64 `
                  --self-contained true -p:PublishSingleFile=true `
                  -o $publishDir

              # Build installer using reusable .iss
              choco install innosetup -y | Out-Null

              $setupDir = "_setup/$($app.BaseName)"
              New-Item -ItemType Directory -Force -Path $setupDir | Out-Null

              & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
                  "/DAppName=$($app.BaseName)" `
                  "/DAppVersion=0.0.0" `          # TODO: Replace with real versioning
                  "/DPublishDir=$publishDir" `
                  "installer\installer.iss"

              # Move the generated setup.exe
              Move-Item "_setup\$($app.BaseName)-Setup-v0.0.0.exe" "$setupDir\$($app.BaseName)-Setup-v0.0.0.exe" -Force

              # Upload per-app artifacts
              Compress-Archive -Path "$publishDir\*" -DestinationPath "$($app.BaseName).zip" -Force

              Write-Host "Artifacts created for $($app.BaseName)"
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DCSMissionInspector-Builds
          path: |
            **/*.zip
            **/*-Setup-*.exe
          retention-days: 30

  release:
    name: Create Release
    runs-on: windows-latest
    needs: build
    if: github.event.inputs.create_release == 'true'
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: DCSMissionInspector-Builds

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.app || 'manual' }}-v0.0.0
          name: ${{ github.event.inputs.app || 'All Apps' }} v0.0.0
          files: |
            **/*.zip
            **/*-Setup-*.exe
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}